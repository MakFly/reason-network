name: release

# Push a tag like v0.10.4 to build reason-network for macOS, Linux and Windows and publish a GitHub release, with the
# install scripts a standalone install (and its updates) uses, and manifest.txt: the sha256 of every file, signed with
# the RELEASE_SIGNING_KEY secret (Ed25519). An update runs nothing from a release whose manifest doesn't verify against
# the key pinned in src/daemon/update.rs, and release-signing.pub is that key. macOS builds are signed ad hoc, so
# install.sh can check their code signature before it runs them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    env:
      # Windows builds carry their C runtime, so they run without the Visual C++ redistributable.
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - if: runner.os == 'macOS'
        run: codesign --force --sign - target/${{ matrix.target }}/release/reason-network
      - name: Package
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf dist/reason-network-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release reason-network
          cd dist && shasum -a 256 reason-network-${{ matrix.target }}.tar.gz > reason-network-${{ matrix.target }}.tar.gz.sha256
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $name = "reason-network-${{ matrix.target }}.zip"
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive target/${{ matrix.target }}/release/reason-network.exe dist/$name
          "$((Get-FileHash dist/$name -Algorithm SHA256).Hash.ToLower())  $name" | Out-File -Encoding ascii dist/$name.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reason-network-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cp install.sh install.ps1 dist/
      - name: Sign the release manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "the RELEASE_SIGNING_KEY secret is not set"; exit 1; }
          key="$RUNNER_TEMP/release-signing.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          cd dist
          {
            echo "reason-network release manifest v1"
            echo "version ${GITHUB_REF_NAME#v}"
            sha256sum reason-network-*.tar.gz reason-network-*.zip install.sh install.ps1
          } > manifest.txt
          openssl pkeyutl -sign -rawin -inkey "$key" -in manifest.txt | base64 -w0 > manifest.txt.sig
          # Signed with the key the updater pins, or not released at all.
          base64 -d manifest.txt.sig > "$RUNNER_TEMP/sig.bin"
          openssl pkeyutl -verify -rawin -pubin -inkey ../release-signing.pub -in manifest.txt -sigfile "$RUNNER_TEMP/sig.bin"
          cat manifest.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          # v1.2.0-rc.1 and the like: a test release, which installs and auto-updates never pick as "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
